# Glosario de Datos del Sistema
# Template Omega 2.0 - Fase 2: Datos (Vista 📦)
# Formato: YAML ejecutable
_manifest:
  urn: "urn:knowledge:fxsl:omega:template-glosario:1.0.0"
  federation:
    visibility: internal
    license: "Proprietary"
  compatibility:
    min_consumer_version: "1.0.0"
    breaking_changes_from: null
  resolution:
    canonical_url: "file://knowledge/domains/omega/templates/omega2_fase2_glosario.yml"
    mirrors: []
  provenance:
    created_by: "FS"
    created_at: "2026-02-19"
    last_modified_by: "FS"
    last_modified_at: "2026-02-19"
    signature: null


_metadata:
  sistema: "[Nombre del Sistema]"
  version: "1.0"
  fecha: "[YYYY-MM-DD]"
  autor: "[Nombre]"

LLM_Parsing_Instructions:
  ID: KODA-LLM-PARSER-01
  Req: Mandatory block following Metadata.
  Prohib: Using for artifact creation or translation.
  Content: |
    BEGIN_LLM_INSTRUCTIONS
    You are an AI agent consuming a KODA artifact. Parse with absolute fidelity.

    FIDELITY: Preserve meat (essential information) and skeleton (structure: headers, IDs, lists, tables) with zero loss. Ignore fat (filler words, rhetoric, stylistic prose).

    LEXICON (expand before processing): Act->Action, Cond->Condition, Ctx->Context, Ctx_Required->Required External Reference, Ctx_Optional->Optional External Reference, Def->Definition, Ex->Example, Mssn->Mission, Obj->Objective, Proc->Process, Purp->Purpose, Ref->Reference, XRef->Cross-Artifact Reference, XRef_Required->Mandatory Cross-Artifact Reference, Req->Requirement, Res->Result, Src->Source, Prohib->Prohibition, Warn->Warning, Just->Justification, Rec->Recommendation

    REFERENCE POLICY: Ref: is internal only—must point to existing ID within THIS document. XRef/XRef_Required: are external only—must point to a URN (optionally with #ID fragment) in another artifact. External documents without specific ID use Ctx:, Ctx_Required:, or Ctx_Optional:.

    LANGUAGE POLICY: Keywords in English, content in original language. Never translate content.
    END_LLM_INSTRUCTIONS

# =============================================================================
# ENTIDADES
# =============================================================================

entidades:
  # --- Ejemplo de Entidad Tipo Persona ---
  - id: ENT-001
    nombre: "Ciudadano"
    nombre_plural: "Ciudadanos"
    tipo: Persona # [Persona | Documento | Evento | Recurso | Concepto | Lugar]
    descripcion: "Individuo que interactúa con el sistema como beneficiario o solicitante"
    identidad: ID # [ID | Valor] - ¿Se distingue por clave única o por contenido?
    dueño: "Registro Civil" # ¿Quién es responsable de su integridad?
    estados: [] # Vacío si es inmutable
    atributos:
      - nombre: rut
        tipo: Identificador
        obligatorio: true
      - nombre: nombre_completo
        tipo: Texto
        obligatorio: true

  # --- Ejemplo de Entidad Tipo Documento con Estados ---
  - id: ENT-002
    nombre: "Solicitud"
    nombre_plural: "Solicitudes"
    tipo: Documento
    descripcion: "Petición formal de un ciudadano para obtener un servicio"
    identidad: ID
    dueño: "Oficina de Partes"
    estados: ["Borrador", "Ingresada", "En Evaluación", "Aprobada", "Rechazada"]
    atributos:
      - nombre: fecha_ingreso
        tipo: Fecha
        obligatorio: true
      - nombre: monto_solicitado
        tipo: Moneda
        obligatorio: false

  # --- Agregar más entidades aquí ---
  # - id: ENT-003
  #   nombre: "[...]"

# =============================================================================
# RELACIONES
# =============================================================================

relaciones:
  - id: REL-001
    nombre: "presenta"
    desde: ENT-001 # Ciudadano
    hacia: ENT-002 # Solicitud
    cardinalidad: "1:N" # Un ciudadano puede presentar muchas solicitudes
    descripcion: "Un Ciudadano presenta una o más Solicitudes"

  # --- Agregar más relaciones aquí ---
  # - id: REL-002
  #   nombre: "[verbo]"
  #   desde: ENT-XXX
  #   hacia: ENT-YYY

# =============================================================================
# INVARIANTES (Reglas que SIEMPRE deben cumplirse)
# =============================================================================

invariantes:
  - id: INV-001
    descripcion: "Toda Solicitud debe tener exactamente un Ciudadano asociado"
    afecta: [ENT-002, REL-001]
    severidad: ERROR # [ERROR | WARNING]

  - id: INV-002
    descripcion: "Una Solicitud Aprobada no puede volver a estado Borrador"
    afecta: [ENT-002]
    severidad: ERROR

# =============================================================================
# VALIDACIÓN
# =============================================================================

_validacion:
  - check: "Cada sustantivo del Canvas de Propósito tiene entrada aquí"
    status: "[OK | PENDIENTE]"
  - check: "Cada entidad tiene al menos 1 atributo definido"
    status: "[OK | PENDIENTE]"
  - check: "Cada entidad con estados tiene al menos 2 estados"
    status: "[OK | PENDIENTE]"
